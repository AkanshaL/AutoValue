
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Car Valuation | AutoValue</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .result-page {
            min-height: 100vh;
            background: #f7f8f6;
            padding: 55px 8%;
        }

        .result-container {
            max-width: 1050px;
            margin: 35px auto;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(0,0,0,0.06);
        }

        .result-photo {
            width: 100%;
            height: 370px;
            object-fit: cover;
        }

        .result-content {
            padding: 40px;
            text-align: center;
        }

        .result-label {
            color: #789477;
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .result-content h1 {
            font-family: 'Manrope', sans-serif;
            font-size: 32px;
            color: #263326;
            margin: 15px 0;
        }

        .price {
            font-family: 'Manrope', sans-serif;
            font-size: 48px;
            font-weight: 800;
            color: #536e52;
            margin: 20px 0;
        }

        .result-description {
            color: #777;
            font-size: 14px;
        }

        .model-tag {
            display: inline-block;
            background: #e9eee7;
            color: #536e52;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 12px;
            margin-top: 20px;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 28px;
            background: #536e52;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }

        @media(max-width: 600px) {
            .result-page { padding: 25px 5%; }
            .result-photo { height: 230px; }
            .result-content { padding: 25px 15px; }
            .price { font-size: 36px; }
        }
    </style>
</head>

<body>

<div class="result-page">

    <div style="text-align:center;">
        <a href="/" style="text-decoration:none; color:#536e52;
        font-size:25px; font-weight:800;">AutoValue.</a>
    </div>

    <div class="result-container">

        <img
            class="result-photo"
            src="{{ car_image }}"
            alt="{{ car_name }}"
        >

        <div class="result-content">

            <p class="result-label">YOUR CAR VALUATION</p>

            <h1>{{ car_name }}</h1>

            <p class="result-description">
                Based on the details you provided, our machine learning
                model estimates your car's resale value at:
            </p>

            <div class="price">
                ₹ {{ "{:,.0f}".format(prediction) }}
            </div>

            <span class="model-tag">
                LightGBM + Optuna Optimized Model
            </span>

            <br>

            <a href="/#predict" class="back-button">
                Estimate Another Car →
            </a>

        </div>
    </div>

</div>

</body>
</html>
